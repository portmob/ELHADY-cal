<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF0F7"> <title>ELHADY Cal+</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

<div class="app">

    <header class="top-app-bar">
        <button class="icon-btn" id="backBtn" onclick="openSection('home')" style="display:none">
            <span class="material-symbols-rounded">arrow_forward</span>
        </button>
        <div class="headline" id="pageTitle" style="flex:1; margin-right:8px;">ELHADY</div>
        <button class="icon-btn" id="themeBtn"><span class="material-symbols-rounded">dark_mode</span></button>
    </header>

    <main>
        <section id="home" class="screen visible">
            <div class="hero-card">
                <img src="icon.png" class="hero-logo" alt="Logo">
                <h2>أهلاً بك</h2>
                <p>نظام إدارة الحسابات المتقدم</p>
            </div>

            <div class="grid-menu">
                <div class="menu-card" onclick="openSection('payments')">
                    <span class="material-symbols-rounded">account_balance_wallet</span>
                    <h3>المدفوعات</h3>
                </div>
                <div class="menu-card" onclick="openSection('supplies')">
                    <span class="material-symbols-rounded">inventory_2</span>
                    <h3>التوريدات</h3>
                </div>
                <div class="menu-card" onclick="openSection('labor')">
                    <span class="material-symbols-rounded">engineering</span>
                    <h3>العمالة</h3>
                </div>
            </div>
        </section>

        <section id="payments" class="screen">
            <div class="summary-row">
                <div class="summary-item">
                    <span class="lbl">الشهر الحالي</span>
                    <span class="val" id="pay_curr">0</span>
                </div>
                <div class="summary-item">
                    <span class="lbl">الشهر السابق</span>
                    <span class="val" id="pay_prev">0</span>
                </div>
                <div class="summary-item">
                    <span class="lbl">الكل</span>
                    <span class="val" id="pay_all">0</span>
                </div>
            </div>

            <div class="card-list" id="paymentsList"></div>
        </section>

        <section id="supplies" class="screen">
            <div class="summary-row">
                <div class="summary-item">
                    <span class="lbl">كمية حالية</span>
                    <span class="val" id="sup_curr">0</span>
                </div>
                <div class="summary-item">
                    <span class="lbl">كمية سابقة</span>
                    <span class="val" id="sup_prev">0</span>
                </div>
                <div class="summary-item">
                    <span class="lbl">الكل</span>
                    <span class="val" id="sup_all">0</span>
                </div>
            </div>
            <div class="card-list" id="suppliesList"></div>
        </section>

        <section id="labor" class="screen">
            <div class="summary-row">
                <div class="summary-item">
                    <span class="lbl">سجلات حالية</span>
                    <span class="val" id="lab_curr">0</span>
                </div>
                <div class="summary-item">
                    <span class="lbl">سجلات سابقة</span>
                    <span class="val" id="lab_prev">0</span>
                </div>
                <div class="summary-item">
                    <span class="lbl">الكل</span>
                    <span class="val" id="lab_all">0</span>
                </div>
            </div>
            <div class="card-list" id="laborList"></div>
        </section>
    </main>

    <button class="fab" id="fab" style="display:none">
        <span class="material-symbols-rounded">add</span>
    </button>

    <nav class="navigation-bar">
        <button class="nav-item active" onclick="openSection('home')" id="nav-home">
            <span class="icon-box"><span class="material-symbols-rounded">home</span></span>
            <span class="label">الرئيسية</span>
        </button>
        <button class="nav-item" onclick="openFilterModal()">
            <span class="icon-box"><span class="material-symbols-rounded">search</span></span>
            <span class="label">بحث</span>
        </button>
        <button class="nav-item" onclick="exportCurrentData()">
            <span class="icon-box"><span class="material-symbols-rounded">download</span></span>
            <span class="label">تصدير</span>
        </button>
    </nav>

</div>

<div class="dialog-backdrop" id="modalBackdrop"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
